services:
  # docker compose up web, then open http://localhost:8080
  web:
    build: .
    entrypoint: ["php", "-S", "0.0.0.0:8080", "-t", "/app/public"]
    ports:
      - "8080:8080"
    volumes:
      # the form starts with your configuration
      - ./loto_config.ini:/app/loto_config.ini:ro

  # docker compose run --rm sort all.csv
  sort:
    build: .
    volumes:
      - .:/work

  # docker compose run --rm test
  test:
    build: .
    working_dir: /app
    entrypoint: ["composer", "check"]
