; Exemple de configuration adaptée à lots_loto_exemple.csv
; Montants en euros. gros_lot / pas_de_bol = 0 pour désactiver.
[adult]
round = 2
quine = 40
double_quine = 80
carton = 120
gros_lot = 290
pas_de_bol = 70

[kid]
round = 1
quine = 30
double_quine = 50
carton = 80
gros_lot = 0
pas_de_bol = 0

; Réglages du tri, tous optionnels (valeurs par défaut indiquées)
[sorting]
; donateurs dont les cadeaux peuvent se retrouver plusieurs fois dans un même lot
allowed_donors[] = "APE de Valleiry"
; min_amount = 5               ; cadeau minimum (€)
; quine_max_share = 0.25       ; un cadeau de Quine vaut au plus 25 % de la cible
; double_quine_max_share = 0.3 ; un cadeau de Double-quine vaut au plus 30 % de la cible
; carton_min_share = 0.17      ; le premier cadeau d'un Carton vaut au moins 17 % de la cible
; tolerance_below = 0.01       ; un lot est complet à 1 % sous sa cible
; tolerance_above = 0.1        ; un lot peut dépasser sa cible de 10 %
; max_vouchers_per_lot = 2     ; bons d'achat max. par lot
; max_attempts = 300           ; essais avant d'abandonner
